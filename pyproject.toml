[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textsearch"
version = "1.0.0"
description = "Parallel Text Search Engine - UTS Komputasi Paralel dan Terdistribusi (247006111020)"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "psutil>=5.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
